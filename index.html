<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selezione Coinquilino - Casa Cardiff</title>
    <style>
        /* Animazione psichedelica per lo sfondo principale */
        @keyframes trip-background {
            0% { background-position: 0% 50%; filter: hue-rotate(0deg); }
            50% { background-position: 100% 50%; filter: hue-rotate(180deg); }
            100% { background-position: 0% 50%; filter: hue-rotate(360deg); }
        }

        /* Animazione al neon pulsante per il contenitore */
        @keyframes psychedelic-box {
            0% { box-shadow: 0 0 20px #ff00ff, inset 0 0 20px #00ffff; border-color: #ff00ff; }
            33% { box-shadow: 0 0 30px #00ff00, inset 0 0 30px #ff0000; border-color: #00ff00; }
            66% { box-shadow: 0 0 40px #ffff00, inset 0 0 40px #0000ff; border-color: #ffff00; }
            100% { box-shadow: 0 0 20px #ff00ff, inset 0 0 20px #00ffff; border-color: #ff00ff; }
        }

        /* Animazione tremolante per il titolo */
        @keyframes glitch-text {
            0% { text-shadow: 2px 2px 0px #ff00ff, -2px -2px 0px #00ffff; }
            25% { text-shadow: -2px 2px 0px #ff0000, 2px -2px 0px #00ff00; }
            50% { text-shadow: 2px -2px 0px #ffff00, -2px 2px 0px #0000ff; }
            75% { text-shadow: -2px -2px 0px #ff00ff, 2px 2px 0px #00ffff; }
            100% { text-shadow: 2px 2px 0px #ff00ff, -2px -2px 0px #00ffff; }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(45deg, #ff00ff, #00ffff, #ff0000, #00ff00, #ffff00, #0000ff, #ff00ff);
            background-size: 600% 600%;
            animation: trip-background 8s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden; 
        }

        .container {
            background-color: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 3px solid #fff;
            max-width: 600px;
            width: 90%;
            animation: psychedelic-box 4s linear infinite;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-top: 0;
            text-transform: uppercase;
            animation: glitch-text 0.5s infinite linear;
        }

        #question-box {
            font-size: 1.8rem;
            margin: 40px 0;
            min-height: 100px;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 10px #fff, 0 0 20px #ff00ff, 0 0 30px #00ffff;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        button {
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: 900;
            border: 2px solid #fff;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease; 
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            z-index: 9999;
        }

        button:hover {
            transform: scale(1.15) rotate(3deg);
            box-shadow: 0 0 30px #fff;
        }

        #btn-start { background-color: #2b2b2b; color: #fff; }
        #btn-yes { background-color: #00ff00; color: #000; }
        #btn-no { background-color: #ff0000; color: #fff; }

        #result {
            font-size: 3.5rem;
            font-weight: 900;
            color: #00ff00;
            text-transform: uppercase;
            animation: glitch-text 0.2s infinite linear, pulse-result 1s infinite alternate;
        }

        @keyframes pulse-result {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Audio player nascosto -->
    <audio id="bg-audio" loop>
        <source src="psychedelic.mp3" type="audio/mpeg">
        Il tuo browser non supporta l'elemento audio.
    </audio>

    <div class="container" id="main-container">
        <h1>Casa Cardiff</h1>
        <div id="question-box">Premi Inizia per scoprire se sei adatto a Casa Cardiff.</div>
        
        <div class="buttons" id="btn-container">
            <button id="btn-start" onclick="startTest()">Inizia</button>
            <button id="btn-yes" class="hidden" onclick="checkAnswer('si')">SÌ</button>
            <button id="btn-no" class="hidden" onclick="checkAnswer('no')">NO</button>
        </div>
    </div>

    <script>
        const questionsData = [
            { text: "Ti droghi?", expected: "si" },
            { text: "Hai un problema con i maschi?", expected: "no" },
            { text: "In questa casa si fa un po' di casino e si sente dalle camere. Riesci a dormire anche se c'è rumore?", expected: "si" },
            { text: "Pensi che la pulizia e la tolleranza vadano di pari passo?", expected: "si" },
            { text: "Sei carica per entrare a Cardiff?", expected: "si", isCrazyYes: true } 
        ];

        let currentIndex = 0;
        let crazyInterval; 

        function startTest() {
            document.getElementById('btn-start').classList.add('hidden');
            document.getElementById('btn-yes').classList.remove('hidden');
            document.getElementById('btn-no').classList.remove('hidden');
            
            // Fai partire la musica psichedelica
            const bgAudio = document.getElementById('bg-audio');
            bgAudio.volume = 0.5; // Imposta il volume al 50%
            bgAudio.play().catch(error => console.log("L'autoplay audio richiede un'interazione diretta."));
            
            showQuestion();
        }

        function showQuestion() {
            if (currentIndex < questionsData.length) {
                document.getElementById('question-box').innerText = questionsData[currentIndex].text;
                
                if (questionsData[currentIndex].isCrazyYes) {
                    makeYesButtonCrazy();
                }
            } else {
                showSuccess();
            }
        }

        function makeYesButtonCrazy() {
            const btnYes = document.getElementById('btn-yes');
            
            btnYes.style.position = 'fixed';
            // Transizione più lunga per far sembrare il movimento uno "scivolamento" lento
            btnYes.style.transition = 'all 1.2s ease-in-out';
            
            crazyInterval = setInterval(() => {
                const maxX = window.innerWidth - btnYes.offsetWidth;
                const maxY = window.innerHeight - btnYes.offsetHeight;
                
                const randomX = Math.max(0, Math.floor(Math.random() * maxX));
                const randomY = Math.max(0, Math.floor(Math.random() * maxY));
                
                btnYes.style.left = randomX + 'px';
                btnYes.style.top = randomY + 'px';
            }, 1500); // Si sposta ogni 1.5 secondi (più lento rispetto a prima)
        }

        function checkAnswer(answer) {
            if (answer === questionsData[currentIndex].expected) {
                
                if (crazyInterval) {
                    clearInterval(crazyInterval);
                }

                currentIndex++;
                showQuestion();
            } else {
                if (crazyInterval) {
                    clearInterval(crazyInterval);
                }
                
                document.getElementById('question-box').innerText = "RISPOSTA SBAGLIATA. IL TRIP È FINITO, NON SEI ADATTO A CASA CARDIFF!";
                document.getElementById('question-box').style.color = "#ff0000";
                document.getElementById('question-box').style.textShadow = "0 0 20px #ff0000";
                
                document.getElementById('btn-container').classList.add('hidden');
                document.getElementById('btn-yes').style.display = 'none';
                
                // Ferma la musica in caso di sconfitta (opzionale)
                document.getElementById('bg-audio').pause();
            }
        }

        function showSuccess() {
            const container = document.getElementById('main-container');
            container.innerHTML = '<div id="result">BENVENUTO A CARDIFF</div>';
        }
    </script>

</body>
</html>
